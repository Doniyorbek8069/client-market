            "name": "UstaMarket",
            "url": "https://ustamarket.uz",
            "inLanguage": ["uz-UZ", "ru-RU"],
            "potentialAction": {

              "target": "https://ustamarket.uz/products?name={search_term_string}",
              "query-input": "required name=search_term_string"

          },
